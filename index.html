<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Patagonia 2026 — Itinerario</title>
<meta name="description" content="Itinerario del viaggio in Patagonia, 26 dicembre - 5 gennaio: Buenos Aires, El Calafate, Puerto Natales, Torres del Paine, Santiago del Cile." />
<meta name="theme-color" content="#eef7fb" />

<!-- icona nella scheda del browser -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏔️</text></svg>" />

<!-- icona e nome quando si aggiunge alla schermata home (iPhone / iPad) -->
<link rel="apple-touch-icon" href="icon-180.png" />
<meta name="apple-mobile-web-app-title" content="Patagonia" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />

<!-- idem su Android -->
<link rel="manifest" href="manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400;500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body data-country="AR">

<header class="hero">
  <svg class="hero-mountains" viewBox="0 0 1200 200" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <polygon points="0,200 0,120 150,40 260,110 340,20 460,120 560,60 700,130 800,50 900,140 1020,70 1120,130 1200,90 1200,200" fill="var(--sky-deco)"/>
    <polygon points="0,200 0,150 120,90 220,150 320,70 420,150 540,100 650,160 760,90 880,160 980,110 1080,160 1200,130 1200,200" fill="var(--accent)" opacity="0.28"/>
    <polygon points="150,40 190,70 210,55 230,80 260,110" fill="var(--snow-deco)" opacity="0.9"/>
    <polygon points="340,20 375,55 395,42 415,68 460,120" fill="var(--snow-deco)" opacity="0.9"/>
    <polygon points="800,50 830,80 850,68 870,95 900,140" fill="var(--snow-deco)" opacity="0.9"/>
  </svg>
  <div class="hero-content">
    <span class="hero-eyebrow">🧊 26 dicembre — 5 gennaio</span>
    <h1 id="trip-title">Patagonia</h1>
    <p class="subtitle" id="trip-subtitle"></p>
    <div class="hero-meta">
      <span class="pill" id="countdown-pill">⏳ tra <strong id="countdown-value">—</strong></span>
      <span class="pill">🕓 <span id="tz-note"></span></span>
      <span class="pill">🇦🇷 5 giorni · 🇨🇱 6 giorni</span>
    </div>
  </div>
</header>

<div class="tabs-bar">
  <div class="tabs-scroll" id="tabs-scroll" role="tablist" aria-label="Giorni del viaggio"></div>
</div>

<main class="panel-wrap">
  <div id="day-panel" role="tabpanel"></div>
</main>

<footer class="footer">
  Frecce ← → o tab in alto per cambiare giorno · Buon viaggio <span class="heart">♥</span>
</footer>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
